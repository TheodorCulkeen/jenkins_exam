apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-db
  template:
    metadata:
      labels:
        app: movie-db
    spec:
      containers:
        - name: postgres
          image:  "{{ .Values.movie.database.image }}"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "{{ .Values.movie.database.user }}"
            - name: POSTGRES_PASSWORD
              value: "{{ .Values.movie.database.password }}"
            - name: POSTGRES_DB
              value: "{{ .Values.movie.database.name }}"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: movie-db-pvc
