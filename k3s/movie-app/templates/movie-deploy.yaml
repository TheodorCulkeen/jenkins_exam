apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-service
  template:
    metadata:
      labels:
        app: movie-service
    spec:
      containers:
        - name: movie-service
          image: "{{ .Values.movie.image.repository }}:{{ .Values.movie.image.tag }}"
          ports:
            - containerPort: {{ .Values.movie.service.port }}
          command: 
            - uvicorn            
          args:
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --loop
            - asyncio                               
          env:
            - name: DATABASE_URI
              value: "postgresql://{{ .Values.movie.database.user }}:{{ .Values.movie.database.password }}@movie-db:5432/{{ .Values.movie.database.name }}"

            - name: CAST_SERVICE_HOST_URL
              value: "http://cast-service:8000/api/v1/casts/"
              
